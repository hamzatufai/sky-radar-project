[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opensky-radar"
version = "0.1.0"
description = "A simple OpenSky aircraft data pipeline"
requires-python = ">=3.9"
dependencies = [
    "python-dotenv>=1.0,<2.0",
    "requests>=2.32,<3.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
